# Constructed from https://github.com/canonical/kubeflow-dashboard/blob/v2.0.0-rc.0-ambient1/components/profile-controller/Dockerfile

name: profile-controller
base: ubuntu@24.04
version: 2.0.0-rc.0-ambient1-pr50
summary: Controller for Kubeflow Profile objects
description: Controller for Kubeflow Profile objects
license: Apache-2.0
run-user: _daemon_

platforms:
  amd64:

services:
  kubeflow-profiles:
    command: /manager
    override: replace
    startup: enabled
    summary: Profile Controller service

parts:
  security-team-requirement:
    plugin: nil
    override-build: |
      mkdir -p ${CRAFT_PART_INSTALL}/usr/share/rocks
      (echo "# os-release" && cat /etc/os-release && echo "# dpkg-query" && dpkg-query -f '${db:Status-Abbrev},${binary:Package},${Version},${source:Package},${Source:Version}\n' -W) > ${CRAFT_PART_INSTALL}/usr/share/rocks/dpkg.query

  profile-controller:
    plugin: go
    source-type: git
    source: https://github.com/canonical/kubeflow-dashboard
    source-commit: 1e28990c85f31f33db2c64994bd0ae56ee1c2dc7
    source-subdir: components/profile-controller
    build-environment:
      - CGO_ENABLED: 0
      - GOOS: linux
    build-snaps:
      - go/1.26/stable
    # Override-build to include the third-party library licenses.
    overlay-packages:
      - ca-certificates
    override-build: |
      cd $CRAFT_PART_SRC_WORK

      go build -a -o $CRAFT_PART_INSTALL/manager main.go

      mkdir -p $CRAFT_PART_INSTALL/third_party/library
      cp -pr third_party/library/. $CRAFT_PART_INSTALL/third_party/library/

      # make config dir
      mkdir -p /etc/profile-controller
    stage:
      - manager
      - third_party/library
    prime:
      - manager
      - third_party/library

  non-root-user:
    plugin: nil
    after:
      - profile-controller
    override-prime: |
      craftctl default
      install -d -o 584792 -g 584792 -m 770 \
        etc/profile-controller
